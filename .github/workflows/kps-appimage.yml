# Fork: builds a Linux AppImage of KeePassXC with KeePass Server sync and publishes it
# as a GitHub Release when a tag ending in -kps<n> is pushed (e.g. 2.8.0-beta1-kps1).
name: KeePass Server AppImage

on:
  push:
    tags:
      - '*-kps*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
      QMAKE: qmake6
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake g++ ninja-build file wget patchelf desktop-file-utils \
            qt6-base-dev qt6-base-private-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools \
            libqt6svg6-dev libqt6svg6 qt6-wayland libgl-dev \
            libbotan-2-dev libargon2-dev libkeyutils-dev libminizip-dev libqrencode-dev zlib1g-dev \
            libreadline-dev libpcsclite-dev libusb-1.0-0-dev libxi-dev libxtst-dev libx11-dev

      - name: Download AppImage tools
        run: |
          mkdir -p "$HOME/bin"
          cd "$HOME/bin"
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage -O linuxdeploy-plugin-qt
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x linuxdeploy linuxdeploy-plugin-qt appimagetool
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="$GITHUB_REF_NAME"; else VERSION="$(git rev-parse --short HEAD)"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        # No update checks: they would point to official KeePassXC, which has no KeePass Server sync
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DKEEPASSXC_DIST_TYPE=AppImage -DKPXC_FEATURE_DOCS=OFF -DKPXC_FEATURE_UPDATES=OFF -DWITH_TESTS=ON
          cmake --build build --parallel "$(nproc)"

      - name: Test
        working-directory: build
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure -R 'testkeepassserver|testmerge|testdatabase|testkdbx4|testkeys'

      - name: Package AppImage
        run: |
          APPDIR="$PWD/build/KeePassXC.AppDir"
          DESTDIR="$APPDIR" cmake --install build --strip
          DESKTOP="$APPDIR/usr/share/applications/org.keepassxc.KeePassXC.desktop"
          echo "X-AppImage-Version=$VERSION" >> "$DESKTOP"
          linuxdeploy --plugin=qt --appdir="$APPDIR" --custom-apprun=share/linux/appimage-apprun.sh \
            --desktop-file="$DESKTOP" --icon-file="$APPDIR/usr/share/icons/hicolor/256x256/apps/keepassxc.png" \
            $(for f in "$APPDIR"/usr/bin/keepassxc*; do echo "--executable=$f"; done)
          ARCH=x86_64 appimagetool "$APPDIR" "KeePassXC-$VERSION-x86_64.AppImage"
          sha256sum "KeePassXC-$VERSION-x86_64.AppImage" > "KeePassXC-$VERSION-x86_64.AppImage.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: KeePassXC-${{ env.VERSION }}-x86_64
          path: KeePassXC-*-x86_64.AppImage*

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" KeePassXC-*-x86_64.AppImage* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "KeePassXC $VERSION (KeePass Server)" \
            --notes "KeePassXC 2.8.0-beta1 with KeePass Server sync (create a database on the server with Test connection, open from server, sync on save/unlock, Work Offline, conflict copies). Linux x86_64 AppImage, built on Ubuntu 24.04 (needs Ubuntu 24.04 or newer). Run: \`chmod +x KeePassXC-*.AppImage && ./KeePassXC-*.AppImage\`. Not an official KeePassXC release."
