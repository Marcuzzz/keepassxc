# Fork: builds a Linux AppImage and macOS DMGs of KeePassXC with KeePass Server sync and
# publishes them as a GitHub Release when a tag ending in -kps<n> is pushed (e.g. 2.8.0-beta1-kps1),
# then deploys the install page (deploy/index.html) to GitHub Pages.
name: KeePass Server builds

on:
  push:
    tags:
      - '*-kps*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
      QMAKE: qmake6
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake g++ ninja-build file wget patchelf desktop-file-utils \
            qt6-base-dev qt6-base-private-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools \
            libqt6svg6-dev libqt6svg6 qt6-wayland libgl-dev \
            libbotan-2-dev libargon2-dev libkeyutils-dev libminizip-dev libqrencode-dev zlib1g-dev \
            libreadline-dev libpcsclite-dev libusb-1.0-0-dev libxi-dev libxtst-dev libx11-dev

      - name: Download AppImage tools
        run: |
          mkdir -p "$HOME/bin"
          cd "$HOME/bin"
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage -O linuxdeploy-plugin-qt
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x linuxdeploy linuxdeploy-plugin-qt appimagetool
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="$GITHUB_REF_NAME"; else VERSION="$(git rev-parse --short HEAD)"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        # No update checks: they would point to official KeePassXC, which has no KeePass Server sync
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DKEEPASSXC_DIST_TYPE=AppImage -DKPXC_FEATURE_DOCS=OFF -DKPXC_FEATURE_UPDATES=OFF -DWITH_TESTS=ON
          cmake --build build --parallel "$(nproc)"

      - name: Test
        working-directory: build
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure -R 'testkeepassserver|testmerge|testdatabase|testkdbx4|testkeys'

      - name: Package AppImage
        run: |
          APPDIR="$PWD/build/KeePassXC.AppDir"
          DESTDIR="$APPDIR" cmake --install build --strip
          DESKTOP="$APPDIR/usr/share/applications/org.keepassxc.KeePassXC.desktop"
          echo "X-AppImage-Version=$VERSION" >> "$DESKTOP"
          linuxdeploy --plugin=qt --appdir="$APPDIR" --custom-apprun=share/linux/appimage-apprun.sh \
            --desktop-file="$DESKTOP" --icon-file="$APPDIR/usr/share/icons/hicolor/256x256/apps/keepassxc.png" \
            $(for f in "$APPDIR"/usr/bin/keepassxc*; do echo "--executable=$f"; done)
          ARCH=x86_64 appimagetool "$APPDIR" "KeePassXC-$VERSION-x86_64.AppImage"
          sha256sum "KeePassXC-$VERSION-x86_64.AppImage" > "KeePassXC-$VERSION-x86_64.AppImage.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: KeePassXC-${{ env.VERSION }}-x86_64-AppImage
          path: KeePassXC-*-x86_64.AppImage*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Homebrew bottles are built for the runner's macOS version, so that is the minimum
          - runner: macos-14
            arch: arm64
            macos-target: '14.0'
          - runner: macos-15-intel
            arch: x86_64
            macos-target: '15.0'
    runs-on: ${{ matrix.runner }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true

      - name: Install dependencies
        run: |
          brew install botan qrencode minizip readline
          PREFIXES="$QT_ROOT_DIR"
          for p in botan qrencode minizip readline; do PREFIXES="$PREFIXES;$(brew --prefix "$p")"; done
          echo "DEPS_PREFIX_PATH=$PREFIXES" >> "$GITHUB_ENV"

      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="$GITHUB_REF_NAME"; else VERSION="$(git rev-parse --short HEAD)"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        # The official entitlements carry the KeePassXC team ID, which an ad-hoc signature can't
        # claim (macOS kills the app on launch), so build with empty entitlements.
        run: |
          cat > share/macosx/keepassxc.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict/></plist>
          PLIST
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$DEPS_PREFIX_PATH" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.macos-target }} -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DKPXC_FEATURE_DOCS=OFF -DKPXC_FEATURE_UPDATES=OFF -DWITH_TESTS=ON
          cmake --build build --parallel "$(sysctl -n hw.ncpu)"

      - name: Test
        working-directory: build
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure -R 'testkeepassserver|testmerge|testdatabase|testkdbx4|testkeys'

      - name: Package DMG
        run: |
          cmake --install build --prefix "$PWD/staging"
          APP="$PWD/staging/KeePassXC.app"
          # Belongs to the official signing identity
          rm -f "$APP/Contents/embedded.provisionprofile"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          ln -s /Applications staging/Applications
          DMG="KeePassXC-$VERSION-${{ matrix.arch }}.dmg"
          hdiutil create -volname KeePassXC -srcfolder staging -fs HFS+ -format UDBZ -ov "$DMG"
          shasum -a 256 "$DMG" > "$DMG.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: KeePassXC-${{ env.VERSION }}-${{ matrix.arch }}-dmg
          path: KeePassXC-*-${{ matrix.arch }}.dmg*

  release:
    if: github.ref_type == 'tag'
    needs: [appimage, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp src/deploy/index.html _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" KeePassXC-* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "KeePassXC $VERSION (KeePass Server)" \
            --notes "KeePassXC 2.8.0-beta1 with KeePass Server sync (create a database on the server with Test connection, open from server, sync on save/unlock, Work Offline, conflict copies). Not an official KeePassXC release.

          **Linux x86_64 AppImage**, built on Ubuntu 24.04 (needs Ubuntu 24.04 or newer): \`chmod +x KeePassXC-*.AppImage && ./KeePassXC-*.AppImage\`

          **macOS DMG**: arm64 (Apple Silicon, macOS 14+) and x86_64 (Intel, macOS 15+). The app is not notarized: after copying it to Applications, run \`xattr -dr com.apple.quarantine /Applications/KeePassXC.app\` (or right-click > Open). Touch ID quick unlock is unavailable in this build."

  deploy-pages:
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
